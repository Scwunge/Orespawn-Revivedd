modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "TheyCallMeDanger, TheBulbacraft (1.12); 1.21.1 port"
description = '''
OreSpawn ported to NeoForge 1.21.1.
Free for everyone — MIT licensed. No DRM, no premium lock.
Use it, share it, modify it, pack it. Do what you want.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
