# 4G heap + Metaspace; avoid OOM kills when NeoForge + runClient share RAM with IDE
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Config cache can leave zombie daemons under heavy IDE use; re-enable later if stable
org.gradle.configuration-cache=false

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.235
loader_version_range=[1,)

mod_id=orespawn
# In-game mods menu name + docs
mod_name=Orespawn Revived
# Built jar base name (no spaces): Orespawn-Revived-<version>.jar
archives_base_name=Orespawn-Revived
# Free for anyone: use, share, mod, sell — see LICENSE (MIT). No DRM.
mod_license=MIT
mod_version=1.0.0-1.21.1-port
mod_group_id=danger.orespawn
